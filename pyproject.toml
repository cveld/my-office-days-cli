[project]
name = "my-office-days-cli"
version = "0.3.0"
description = "Personal CLI for My Office Days"
readme = "README.md"
license = "MIT"
authors = [{ name = "Carl in 't Veld" }]
keywords = ["my-office-days", "cli", "workplace", "booking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46,<51",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "typer>=0.19,<1",
]

[project.scripts]
mod = "my_office_days.cli:app"
my-office-days-cli = "my_office_days.cli:app"

[project.urls]
Homepage = "https://github.com/cveld/my-office-days-cli"
Repository = "https://github.com/cveld/my-office-days-cli"
Issues = "https://github.com/cveld/my-office-days-cli/issues"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "respx>=0.22,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_office_days"]

[tool.pytest.ini_options]
testpaths = ["tests"]
